# yaml-language-server: $schema=https://taskfile.dev/schema.json
# ---
# Docs:
# https://taskfile.dev/
# https://taskfile.dev/docs/reference/schema
version: "3"

vars:
  DEBUG: false

tasks:
  all:
    desc: "Run the whole recipe workflow"
    cmds:
      - task: build-sample-app

  clean:
    desc: Clean up artifacts
    cmds:
      - cmd: git clean -fdx target/

  build-sample-app:
    desc: Build the sample application
    sources:
      - "src/app/*.c"
    generates:
      - "target/app/app.bin"
    cmds:
      - cmd: mkdir -p target/app/
      - cmd: gcc -Wall -Werror  -ldl  -o target/app/app.bin  src/app/fake-app.c
      - cmd: ./target/app/app.bin

# eof
